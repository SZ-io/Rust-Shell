name: CI
on: [push,pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/tollchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings